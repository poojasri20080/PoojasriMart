<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PoojaMart Toys</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .auth-wrapper {
            max-width: 900px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: var(--radius-sm);
            box-shadow: 0 4px 18px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: 340px 1fr;
            overflow: hidden;
        }

        .auth-left-banner {
            background-color: var(--primary-blue);
            color: #ffffff;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .auth-left-banner h2 {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 14px;
        }

        .auth-right-form {
            padding: 35px 35px;
        }

        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .full-col {
            grid-column: 1 / -1;
        }

        .auth-input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .auth-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 2px;
            font-size: 14px;
            outline: none;
        }

        .auth-input:focus {
            border-color: var(--primary-blue);
        }

        @media (max-width: 768px) {
            .auth-wrapper {
                grid-template-columns: 1fr;
            }
            .form-grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="brand-logo">
                <span class="brand-title">PoojaMart <span>Toys</span></span>
                <span class="brand-tagline">Explore <span>Plus ★</span></span>
            </a>
            <div style="margin-left:auto;">
                <a href="login.html" class="nav-item-link" style="font-size:13px;">Already have an account? Login</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="auth-wrapper">
            <!-- Left Banner -->
            <div class="auth-left-banner">
                <div>
                    <h2>Looks like you're new here!</h2>
                    <p>Sign up with your details to get started with PoojaMart Toys.</p>
                </div>
                <div style="font-size: 64px; text-align: center; margin-top: 30px;">
                    🎁🎪🧸
                </div>
            </div>

            <!-- Right Registration Form -->
            <div class="auth-right-form">
                <div id="reg-error-msg" style="display:none;background:#ffebee;color:#c62828;padding:10px 14px;border-radius:4px;font-size:13px;margin-bottom:16px;"></div>

                <form id="register-form">
                    <div class="form-grid-2">
                        <div class="auth-input-group full-col">
                            <label>Full Name *</label>
                            <input type="text" id="reg-name" class="auth-input" placeholder="e.g. Rahul Sharma" required>
                        </div>

                        <div class="auth-input-group full-col">
                            <label>Email Address *</label>
                            <input type="email" id="reg-email" class="auth-input" placeholder="e.g. rahul@example.com" required>
                        </div>

                        <div class="auth-input-group full-col">
                            <label>Password (Min 6 characters) *</label>
                            <input type="password" id="reg-password" class="auth-input" placeholder="Choose a secure password" minlength="6" required>
                        </div>

                        <div class="auth-input-group full-col">
                            <label>Mobile Number *</label>
                            <input type="tel" id="reg-phone" class="auth-input" placeholder="10-digit mobile number" required>
                        </div>

                        <div class="auth-input-group full-col">
                            <label>Default Shipping Address</label>
                            <input type="text" id="reg-address" class="auth-input" placeholder="Door No, Street name, Landmark">
                        </div>

                        <div class="auth-input-group">
                            <label>City</label>
                            <input type="text" id="reg-city" class="auth-input" placeholder="City" value="Chennai">
                        </div>

                        <div class="auth-input-group">
                            <label>State</label>
                            <input type="text" id="reg-state" class="auth-input" placeholder="State" value="Tamil Nadu">
                        </div>

                        <div class="auth-input-group full-col">
                            <label>Postal PIN Code</label>
                            <input type="text" id="reg-pin" class="auth-input" placeholder="6-digit PIN code" maxlength="6" value="600040">
                        </div>
                    </div>

                    <div style="margin-top:20px;">
                        <button type="submit" class="btn btn-buy btn-block" style="padding:12px;font-size:15px;">
                            CONTINUE & REGISTER ➔
                        </button>
                    </div>

                    <div style="margin-top:16px;text-align:center;">
                        <a href="login.html" class="btn btn-outline btn-block" style="padding:10px;font-size:14px;">
                            Existing User? Log in
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
