# PoojaMart Toys - Spring Boot Configuration
server.port=8080
spring.application.name=poojamart-toys

# Static resources mapping
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Primary MySQL Configuration
# (Change username and password if your local MySQL settings differ)
spring.datasource.url=jdbc:mysql://localhost:3306/poojamart?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null
