<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - PoojaMart Toys</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .profile-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 20px;
            margin: 20px auto;
            max-width: 1000px;
        }

        .profile-sidebar {
            background: #ffffff;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-subtle);
            overflow: hidden;
            height: fit-content;
        }

        .profile-user-badge {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid #f0f0f0;
        }

        .profile-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #e3f2fd;
            color: var(--primary-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
        }

        .profile-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 1px solid #f5f5f5;
            transition: var(--transition);
        }

        .profile-menu-item:hover, .profile-menu-item.active {
            background: #f0f7ff;
            color: var(--primary-blue);
        }

        .profile-content-card {
            background: #ffffff;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-subtle);
            padding: 24px;
        }

        @media (max-width: 768px) {
            .profile-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="brand-logo">
                <span class="brand-title">PoojaMart <span>Toys</span></span>
                <span class="brand-tagline">Explore <span>Plus ★</span></span>
            </a>

            <!-- Search Bar -->
            <div class="search-wrapper">
                <form class="search-form" id="global-search-form">
                    <input type="text" id="global-search-input" class="search-input" placeholder="Search for toys..." autocomplete="off">
                    <button type="submit" class="search-btn">🔍</button>
                </form>
            </div>

            <!-- Header Actions -->
            <div class="header-actions">
                <div id="header-auth-container"></div>
                <a href="cart.html" class="nav-item-link">
                    <div class="cart-icon-wrapper">
                        <span>🛒 Cart</span>
                        <span class="cart-badge" style="display:none;">0</span>
                    </div>
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Breadcrumb -->
        <nav class="breadcrumb-nav">
            <a href="index.html">Home</a>
            <span>›</span>
            <span class="current">My Profile</span>
        </nav>

        <div class="profile-layout">
            <!-- Sidebar -->
            <div class="profile-sidebar">
                <div class="profile-user-badge">
                    <div class="profile-avatar">👤</div>
                    <div>
                        <div style="font-size:12px;color:#878787;">Hello,</div>
                        <div style="font-size:15px;font-weight:700;" id="sidebar-user-name">User</div>
                    </div>
                </div>
                <a href="profile.html" class="profile-menu-item active">👤 Profile Information</a>
                <a href="orders.html" class="profile-menu-item">📦 My Orders</a>
                <a href="cart.html" class="profile-menu-item">🛒 My Cart</a>
                <a href="javascript:void(0)" onclick="handleLogout()" class="profile-menu-item" style="color:#d32f2f;">🚪 Logout</a>
            </div>

            <!-- Main Form Card -->
            <div class="profile-content-card">
                <h2 style="font-size:18px;font-weight:700;margin-bottom:20px;border-bottom:1px solid #f0f0f0;padding-bottom:12px;">
                    Personal Information & Saved Address
                </h2>

                <form id="profile-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="prof-name" required>
                        </div>

                        <div class="form-group">
                            <label>Email Address (Read Only)</label>
                            <input type="email" id="prof-email" readonly style="background:#f5f5f5;">
                        </div>

                        <div class="form-group">
                            <label>Mobile Number</label>
                            <input type="tel" id="prof-phone">
                        </div>

                        <div class="form-group">
                            <label>Update Password (leave blank to keep current)</label>
                            <input type="password" id="prof-password" placeholder="New Password">
                        </div>

                        <div class="form-group full-width">
                            <label>Delivery Address</label>
                            <input type="text" id="prof-address" placeholder="Flat, Street, Area">
                        </div>

                        <div class="form-group">
                            <label>City</label>
                            <input type="text" id="prof-city">
                        </div>

                        <div class="form-group">
                            <label>State</label>
                            <input type="text" id="prof-state">
                        </div>

                        <div class="form-group full-width">
                            <label>PIN Code</label>
                            <input type="text" id="prof-pin" maxlength="6">
                        </div>
                    </div>

                    <div style="margin-top:20px;">
                        <button type="submit" class="btn btn-primary" style="padding:10px 28px;">
                            SAVE CHANGES
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = Storage.getUser();
            if (user) {
                const el = document.getElementById('sidebar-user-name');
                if (el) el.textContent = user.name;
            }
        });
    </script>
</body>
</html>
