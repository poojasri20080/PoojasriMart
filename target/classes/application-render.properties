# PoojaMart Toys - Render Cloud Profile Configuration
server.port=${PORT:8080}
spring.application.name=poojamart-toys

# Static resources mapping
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Embedded H2 Database (Compatible with H2 2.1+)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/poojamart;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Jackson JSON
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null
